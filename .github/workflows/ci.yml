name: CI

on:
  push:
    branches: [ "master", "reworked", "distributed-authority" ]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  core:
    name: Core tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Check formatting
        run: dotnet format Netfox.slnx --verify-no-changes
      - name: Run tests
        run: dotnet test Netfox.slnx

  godot:
    name: Godot tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: godot
          key: godot-${{ env.GODOT_VERSION }}-mono-linux-x86_64
      - name: Install Godot
        run: |
          # The download has failed mid-run before, leaving an HTML error page named godot.zip: -f rejects that, and
          # the retries cover a flaky release server. The cache above means most runs do not download at all.
          if [ ! -x "godot/Godot_v${GODOT_VERSION}_mono_linux_x86_64/Godot_v${GODOT_VERSION}_mono_linux.x86_64" ]; then
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/$GODOT_VERSION/Godot_v${GODOT_VERSION}_mono_linux_x86_64.zip"
            unzip -q godot.zip -d godot
          fi
          echo "GODOT=$PWD/godot/Godot_v${GODOT_VERSION}_mono_linux_x86_64/Godot_v${GODOT_VERSION}_mono_linux.x86_64" >> "$GITHUB_ENV"
      - name: Install Rapier
        # The project is Rapier-first (netfox-net#52): project.godot already asks for Rapier3D, this drops the
        # pinned extension next to it. Without this step every physics body would sit on an engine that is not there.
        run: sh tools/install-extensions.sh rapier
      - name: Import resources
        # --import exits with a segfault after a successful import on 4.7.2, so its exit code says nothing
        run: $GODOT --headless --path . --import || true
      - name: Build
        run: dotnet build Netfox.csproj
      - name: Doc examples compile
        run: python3 tools/check-doc-examples.py
      - name: Run Godot tests
        run: $GODOT --headless --path . res://test/TestRunner.tscn
      - name: Playground smoke under the bad profile
        run: |
          "$GODOT" --headless --path . res://examples/playground/playground.tscn -- --smoke --host --seconds=40 --profile=bad --port=20000 > pg-host.log 2>&1 &
          host=$!
          sleep 8
          "$GODOT" --headless --path . res://examples/playground/playground.tscn -- --smoke --join --smoke-client=a --seconds=24 --profile=bad --port=20000 > pg-client-a.log 2>&1 &
          client_a=$!
          sleep 2
          "$GODOT" --headless --path . res://examples/playground/playground.tscn -- --smoke --join --smoke-client=b --seconds=20 --profile=bad --port=20000 > pg-client-b.log 2>&1 || true
          wait $client_a || true
          wait $host || true
          echo "--- host"; grep -E "PLAYGROUND|ERROR|Exception" pg-host.log || cat pg-host.log
          echo "--- client A"; grep -E "PLAYGROUND|ERROR|Exception" pg-client-a.log || cat pg-client-a.log
          echo "--- client B"; grep -E "PLAYGROUND|ERROR|Exception" pg-client-b.log || cat pg-client-b.log
          # The verdict line, not the exit code: Godot has crashed on shutdown after printing it
          grep -q "role=host ok=True" pg-host.log \
            && grep -q "role=client-a ok=True" pg-client-a.log \
            && grep -q "role=client-b ok=True" pg-client-b.log

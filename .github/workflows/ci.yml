name: CI

on:
  push:
    branches: [ "master", "reworked" ]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  core:
    name: Core tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Check formatting
        run: dotnet format Netfox.slnx --verify-no-changes
      - name: Run tests
        run: dotnet test Netfox.slnx

  godot:
    name: Godot tests and e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: godot
          key: godot-${{ env.GODOT_VERSION }}-mono-linux-x86_64
      - name: Install Godot
        run: |
          # The download has failed mid-run before, leaving an HTML error page named godot.zip: -f rejects that, and
          # the retries cover a flaky release server. The cache above means most runs do not download at all.
          if [ ! -x "godot/Godot_v${GODOT_VERSION}_mono_linux_x86_64/Godot_v${GODOT_VERSION}_mono_linux.x86_64" ]; then
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/$GODOT_VERSION/Godot_v${GODOT_VERSION}_mono_linux_x86_64.zip"
            unzip -q godot.zip -d godot
          fi
          echo "GODOT=$PWD/godot/Godot_v${GODOT_VERSION}_mono_linux_x86_64/Godot_v${GODOT_VERSION}_mono_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import resources
        # --import exits with a segfault after a successful import on 4.7.2, so its exit code says nothing
        run: $GODOT --headless --path . --import || true
      - name: Build
        run: dotnet build Netfox.csproj
      - name: Run Godot tests
        run: $GODOT --headless --path . res://test/TestRunner.tscn
      - name: Run e2e over ENet
        run: |
          "$GODOT" --headless --path . res://examples/e2e/E2E.tscn -- --host --seconds=14 > host.log 2>&1 &
          host=$!
          sleep 2
          "$GODOT" --headless --path . res://examples/e2e/E2E.tscn -- --join --seconds=10 > client.log 2>&1 || true
          wait $host || true
          echo "--- host"; cat host.log
          echo "--- client"; cat client.log
          grep -q "ok=True" host.log && grep -q "ok=True" client.log
      - name: Run the playground sample
        run: |
          "$GODOT" --headless --path . res://examples/playground/PlaygroundSmoke.tscn -- --host --seconds=14 > pg-host.log 2>&1 &
          host=$!
          sleep 3
          "$GODOT" --headless --path . res://examples/playground/PlaygroundSmoke.tscn -- --join --seconds=8 > pg-client.log 2>&1 || true
          wait $host || true
          echo "--- host"; cat pg-host.log
          echo "--- client"; cat pg-client.log
          grep -q "ok=True" pg-host.log && grep -q "ok=True" pg-client.log
      - name: Check two peers agree about each other after a collision
        run: |
          "$GODOT" --headless --path . res://examples/playground/ConvergenceSmoke.tscn -- --host > cv-host.log 2>&1 &
          host=$!
          sleep 3
          "$GODOT" --headless --path . res://examples/playground/ConvergenceSmoke.tscn -- --join > cv-client.log 2>&1 || true
          wait $host || true
          echo "--- host"; cat cv-host.log
          echo "--- client"; cat cv-client.log
          grep -q "ok=True" cv-host.log && grep -q "ok=True" cv-client.log
      - name: Check a player rides the moving platform
        run: $GODOT --headless --path . res://examples/playground/PlatformRideCheck.tscn
      - name: Clone the GDScript original for the parity trace
        uses: actions/checkout@v5
        with:
          repository: foxssake/netfox
          ref: a15e6c03be648b7d2ebc4575079008a07d1cdffb
          path: netfox
      - name: Import the original's resources
        run: $GODOT --headless --path netfox --import || true
      - name: Compare tick traces against the original
        run: sh parity/run-parity.sh "$GODOT"
      - name: Run e2e through the proxy, under what a real network does
        run: |
          "$GODOT" --headless --path . res://examples/e2e/E2E.tscn -- --host --seconds=14 --profile=realistic > host-lossy.log 2>&1 &
          host=$!
          sleep 2
          "$GODOT" --headless --path . res://examples/e2e/E2E.tscn -- --join --seconds=10 --profile=realistic > client-lossy.log 2>&1 || true
          wait $host || true
          echo "--- host"; cat host-lossy.log
          echo "--- client"; cat client-lossy.log
          grep -q "ok=True" host-lossy.log && grep -q "ok=True" client-lossy.log

name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version:
        description: Version to package, without the leading v
        required: true

permissions:
  contents: write

jobs:
  package:
    name: Package the addon
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: version
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # plugin.cfg is the source of truth, so a tag that disagrees with it is a mistake, not something to paper over
      - name: Check plugin.cfg against the version
        run: |
          declared=$(sed -n 's/^version="\(.*\)"$/\1/p' addons/cracknet/plugin.cfg)
          if [ "$declared" != "${{ steps.version.outputs.version }}" ]; then
            echo "plugin.cfg says $declared, the release says ${{ steps.version.outputs.version }}" >&2
            exit 1
          fi

      # The addon compiles into the game's own assembly, so CrackNet.Core ships as sources next to it: dropping the one
      # folder into a project is enough, with no project reference to add
      - name: Stage the addon
        run: |
          mkdir -p stage/addons
          cp -r addons/cracknet stage/addons/cracknet
          mkdir -p stage/addons/cracknet/Core
          (cd CrackNet.Core && find . -name '*.cs' -not -path './obj/*' -not -path './bin/*' -exec cp --parents {} ../stage/addons/cracknet/Core/ \;)
          cp LICENSE stage/addons/cracknet/ 2>/dev/null || true

          # The property generator is a compiler plugin, so it ships built. It is optional: without it the declaring
          # interfaces can still be implemented by hand, only the attributes go away.
          dotnet build CrackNet.SourceGenerators/CrackNet.SourceGenerators.csproj -c Release
          mkdir -p stage/addons/cracknet/analyzers
          cp CrackNet.SourceGenerators/bin/Release/netstandard2.0/CrackNet.SourceGenerators.dll stage/addons/cracknet/analyzers/

      # Proves the packaged layout is usable on its own: same folder, no project reference, nothing else from the repo
      - name: Check the package compiles by itself
        run: |
          mkdir -p smoke
          cp -r stage/addons smoke/addons
          cat > smoke/Smoke.csproj <<'EOF'
          <Project Sdk="Godot.NET.Sdk/4.7.2">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <EnableDynamicLoading>true</EnableDynamicLoading>
              <Nullable>enable</Nullable>
              <ImplicitUsings>enable</ImplicitUsings>
              <RootNamespace>CrackNet</RootNamespace>
              <LangVersion>latest</LangVersion>
            </PropertyGroup>
            <ItemGroup>
              <Analyzer Include="addons/cracknet/analyzers/CrackNet.SourceGenerators.dll" />
            </ItemGroup>
          </Project>
          EOF
          dotnet build smoke/Smoke.csproj

      - name: Zip
        run: |
          cd stage
          zip -qr "../cracknet-${{ steps.version.outputs.version }}.zip" addons

      - uses: actions/upload-artifact@v4
        with:
          name: cracknet-${{ steps.version.outputs.version }}
          path: cracknet-${{ steps.version.outputs.version }}.zip

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "cracknet-${{ steps.version.outputs.version }}.zip" --clobber
